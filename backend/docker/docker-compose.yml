name: ip-management-backend

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ip-management-app:local
    container_name: ip-management-app
    restart: unless-stopped
    env_file:
      - ./.envs/app.env
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"

